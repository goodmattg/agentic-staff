[project]
name = "agentic-staff"
version = "0.1.0"
description = "Explicit Pydantic Graph workflow for native coding agents."
requires-python = ">=3.10"
dependencies = [
    "pydantic-graph==2.51.0",
    "python-dotenv>=1.0",
    "typesafe-sdk>=0.6,<0.7",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
